<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Авторизация в игре 'Разрежь фигуру'">
    <meta name="theme-color" content="#1d1d1d">
    <title>Авторизация</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body>
    <button 
      class="btn-back-to-site"
      onclick="window.location.href='/myResume/#/coursework'"
      title="Вернуться на сайт"
    >
      ← Назад на сайт
    </button>
    <div class="ring">
      <i style="--clr: #00ff0a"></i>
      <i style="--clr: #ff0057"></i>
      <i style="--clr: #fffd44"></i>
      <div class="login">
        <h2 id="form-title">Авторизация</h2>
        <div class="inputBx">
          <input type="text" placeholder="Никнейм" id="nickInput"/>
        </div>
        <div class="inputBx">
          <input type="password" placeholder="Пароль" id="passwordInput"/>
        </div>
        <div class="inputBx" id="confirmPasswordBox" style="display: none;">
          <input type="password" placeholder="Подтвердите пароль" id="confirmPasswordInput"/>
        </div>
        <div class="inputBx" id="submit-btn">
          <input type="submit" value="Войти" id="submitBtnInput"/>
        </div>
        <div class="btn" id="generate-nick-btn" style="display: none;">
          <button>Сгенерировать никнейм</button>
        </div>
        <div class="btn" id="toggle-form-btn">
          <button>Нет аккаунта? Зарегистрироваться</button>
        </div>
      </div>
    </div>




    <script src="auth.js" type="module"></script>
    <script>
      if (window.self !== window.top) {
        const backButton = document.querySelector('.btn-back-to-site');
        if (backButton) {
          backButton.style.display = 'none';
        }
      }
    </script>
  </body>
</html>
